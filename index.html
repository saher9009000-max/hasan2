
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaCraft Pro | منصة الترجمة الذكية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الهيدر العلوي -->
    <header class="app-header">
        <div class="logo-container">
            <div class="logo-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path>
                </svg>
            </div>
            <h1>Lingua<span class="gradient-text">Craft</span></h1>
        </div>
        <div class="header-badge">Pro SaaS Edition</div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-container">
        
       <!-- حاوية لوحة الترجمة -->
       <div class="translator-card">
           
           <!-- شريط التحكم باللغات -->
           <div class="toolbar">
               <div class="language-selector-group">
                   <select id="sourceLang" aria-label="لغة المصدر">
                       <option value="ar" selected>العربية</option>
                       <option value="en">الإنجليزية (English)</option>
                       <option value="fr">الفرنسية (Français)</option>
                       <option value="es">الإسبانية (Español)</option>
                   </select>

                   <button id="swapBtn" class="icon-btn" aria-label="تبديل اللغات" title="تبديل اللغات">
                       <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                           <path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/>
                       </svg>
                   </button>

                   <select id="targetLang" aria-label="اللغة الهدف">
                       <option value="ar">العربية</option>
                       <option value="en" selected>الإنجليزية (English)</option>
                       <option value="fr">الفرنسية (Français)</option>
                       <option value="es">الإسبانية (Español)</option>
                   </select>
               </div>
           </div>

           <!-- صندوق إدخال وإخراج النصوص -->
           <div class="panes-grid">
               
               <!-- لوحة المصدر -->
               <div class="pane source-pane">
                   <div class="pane-header">
                       <span class="pane-title">النص الأصلي</span>
                       <button id="clearBtn" class="text-action-btn" title="مسح النص">مسح</button>
                   </div>
                   <div class="textarea-wrapper">
                       <textarea id="sourceText" placeholder="اكتب أو الصق النص هنا للترجمة..." dir="rtl"></textarea>
                   </div>
                   <div class="pane-footer">
                       <span class="char-counter"><span id="charCount">0</span> حرف</span>
                   </div>
               </div>

               <!-- لوحة الهدف -->
               <div class="pane target-pane">
                   <div class="pane-header">
                       <span class="pane-title">الترجمة الفورية</span>
                       <div class="pane-actions">
                           <button id="copyBtn" class="icon-action-btn" title="نسخ الترجمة" disabled>
                               <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                   <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                               </svg>
                               <span>نسخ</span>
                           </button>
                       </div>
                   </div>
                   <div class="textarea-wrapper">
                       <textarea id="targetText" placeholder="ستظهر الترجمة هنا..." readonly dir="ltr"></textarea>
                       <!-- حالة التحميل -->
                       <div id="loadingOverlay" class="loading-overlay hidden">
                           <div class="spinner"></div>
                           <span>جاري الترجمة الذكية...</span>
                       </div>
                   </div>
                   <div class="pane-footer">
                       <span class="status-indicator">جاهز للترجمة</span>
                   </div>
               </div>

           </div>

           <!-- زر العمل الرئيسي -->
           <div class="action-footer">
               <button id="translateBtn" class="primary-btn">
                   <span>ترجمة الآن</span>
                   <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                       <path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>
                   </svg>
               </button>
           </div>

       </div>
    </main>

    <!-- نظام التنبيهات (Toast) -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
