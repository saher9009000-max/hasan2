<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaCraft Pro | منصة الترجمة الذكية</title>
    <!-- مكتبة PDF.js لقراءة الملفات -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="logo-container">
            <div class="logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path>
                </svg>
            </div>
            <h1>Lingua<span class="gradient-text">Craft</span></h1>
        </div>
        <div class="header-badge">Pro SaaS</div>
    </header>

    <main class="main-container">
       <div class="translator-card">
           
           <!-- شريط اختيار اللغات -->
           <div class="toolbar">
               <div class="lang-box">
                   <label>من:</label>
                   <select id="sourceLang">
                       <option value="ar" selected>العربية</option>
                       <option value="en">الإنجليزية (English)</option>
                       <option value="fr">الفرنسية (Français)</option>
                       <option value="es">الإسبانية (Español)</option>
                       <option value="de">الألمانية (Deutsch)</option>
                       <option value="tr">التركية (Türkçe)</option>
                       <option value="it">الإيطالية (Italiano)</option>
                       <option value="ru">الروسية (Русский)</option>
                       <option value="zh">الصينية (中文)</option>
                       <option value="ja">اليابانية (日本語)</option>
                       <option value="ko">الكورية (한국어)</option>
                       <option value="pt">البرتغالية (Português)</option>
                       <option value="nl">الهولندية (Nederlands)</option>
                       <option value="fa">الفارسية (فارسی)</option>
                       <option value="ur">الأوردو (اردو)</option>
                   </select>
               </div>

               <button id="swapBtn" class="swap-btn" title="تبديل اللغات">
                   <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                       <path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/>
                   </svg>
               </button>

               <div class="lang-box">
                   <label>إلى:</label>
                   <select id="targetLang">
                       <option value="ar">العربية</option>
                       <option value="en" selected>الإنجليزية (English)</option>
                       <option value="fr">الفرنسية (Français)</option>
                       <option value="es">الإسبانية (Español)</option>
                       <option value="de">الألمانية (Deutsch)</option>
                       <option value="tr">التركية (Türkçe)</option>
                       <option value="it">الإيطالية (Italiano)</option>
                       <option value="ru">الروسية (Русский)</option>
                       <option value="zh">الصينية (中文)</option>
                       <option value="ja">اليابانية (日本語)</option>
                       <option value="ko">الكورية (한국어)</option>
                       <option value="pt">البرتغالية (Português)</option>
                       <option value="nl">الهولندية (Nederlands)</option>
                       <option value="fa">الفارسية (فارسی)</option>
                       <option value="ur">الأوردو (اردو)</option>
                   </select>
               </div>
           </div>

           <!-- قسم الإدخال والنتائج -->
           <div class="panes-container">
               
               <!-- 1. خانة إدخال النص ولصقه -->
               <div class="pane source-pane">
                   <div class="pane-header">
                       <span class="pane-title">النص الأصلي</span>
                       <div class="btn-group">
                           <button id="pasteBtn" class="btn-tool" title="لصق النص من الحافظة">
                               <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                               <span>لصق</span>
                           </button>

                           <label for="fileInput" class="btn-tool btn-primary-light" title="رفع ملف PDF أو TXT">
                               <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                               <span>ملف PDF</span>
                           </label>
                           <input type="file" id="fileInput" accept=".txt,.pdf" style="display: none;">

                           <button id="micBtn" class="btn-tool" title="إملاء صوتي">
                               <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                           </button>

                           <button id="clearBtn" class="btn-tool btn-danger" title="مسح">مسح</button>
                       </div>
                   </div>

                   <div class="textarea-box">
                       <textarea id="sourceText" placeholder="اكتب النص هنا، أو اضغط على زر (لصق)، أو ارفع ملف PDF..." dir="rtl" maxlength="25000"></textarea>
                   </div>

                   <div class="pane-footer">
                       <span class="char-count"><span id="charCount">0</span> / 25,000 حرف</span>
                   </div>
               </div>

               <!-- 2. خانة نتائج الترجمة -->
               <div class="pane target-pane">
                   <div class="pane-header">
                       <span class="pane-title">نتيجة الترجمة</span>
                       <div class="btn-group">
                           <button id="speakBtn" class="btn-tool" disabled title="استماع">
                               <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                               <span>استماع</span>
                           </button>

                           <button id="copyBtn" class="btn-tool" disabled title="نسخ">
                               <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                               <span>نسخ</span>
                           </button>
                       </div>
                   </div>

                   <div class="textarea-box">
                       <textarea id="targetText" placeholder="ستظهر نتيجة الترجمة هنا تلقائياً..." readonly dir="ltr"></textarea>
                       
                       <div id="loadingOverlay" class="loading-overlay hidden">
                           <div class="spinner"></div>
                           <span>جاري الترجمة...</span>
                       </div>
                   </div>

                   <div class="pane-footer">
                       <span id="statusIndicator">جاهز للترجمة</span>
                   </div>
               </div>

           </div>

           <!-- زر الترجمة الرئيسي البارز -->
           <div class="action-footer">
               <button id="translateBtn" class="main-translate-btn">
                   <span>ترجمة النص الآن</span>
                   <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
               </button>
           </div>

       </div>
    </main>

    <div id="toastContainer" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
