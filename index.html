<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ترجمة | Translate Pro</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-glow"></div>

  <header class="header">
    <div class="logo">🌐 <span>ترجمة</span></div>
    <p class="tagline">ترجم نصوصك وصوتك بين أكثر من 100 لغة</p>
  </header>

  <main class="container">
    <section class="card">
      <div class="lang-bar">
        <select id="fromLang" class="lang-select"></select>
        <button id="swapBtn" class="swap-btn" title="تبديل">⇄</button>
        <select id="toLang" class="lang-select"></select>
      </div>

      <div class="panes">
        <div class="pane">
          <textarea id="inputText" placeholder="اكتب النص هنا..."></textarea>
          <div class="pane-actions">
            <button id="micBtn" class="icon-btn" title="إدخال صوتي">🎤</button>
            <button id="speakInput" class="icon-btn" title="نطق النص">🔊</button>
            <button id="clearBtn" class="icon-btn" title="مسح">🗑️</button>
          </div>
        </div>

        <div class="pane">
          <textarea id="outputText" placeholder="الترجمة..." readonly></textarea>
          <div class="pane-actions">
            <button id="speakOutput" class="icon-btn" title="نطق الترجمة">🔊</button>
            <button id="copyBtn" class="icon-btn" title="نسخ">📋</button>
          </div>
        </div>
      </div>

      <button id="translateBtn" class="main-btn">ترجم الآن</button>
    </section>
  </main>

  <footer class="footer">صُنع بـ ❤️ — ترجمة فورية نصاً وصوتاً</footer>

  <script src="script.js"></script>
</body>
</html>
